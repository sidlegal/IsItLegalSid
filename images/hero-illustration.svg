<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an evidence board with a document, handcuffs, a scale of justice and a gavel">
  <style>
    .float-card { animation: floaty 4.5s ease-in-out infinite; transform-origin: center; }
    .float-card.d2 { animation-delay: 0.6s; }
    .float-card.d3 { animation-delay: 1.2s; }
    .float-card.d4 { animation-delay: 1.8s; }
    .gavel-rock { animation: rock 3.2s ease-in-out infinite; transform-origin: 300px 300px; }
    .scale-sway { animation: sway 5s ease-in-out infinite; transform-origin: 240px 160px; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rock {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .float-card, .gavel-rock, .scale-sway { animation: none; }
    }
  </style>

  <circle cx="240" cy="240" r="220" fill="#FAF8F5"/>
  <circle cx="240" cy="240" r="220" fill="#F3A916" opacity="0.08"/>

  <!-- pinned document, upper left -->
  <g class="float-card" transform="translate(60,55) rotate(-8)">
    <rect x="0" y="0" width="104" height="132" rx="4" fill="#FFFFFF" stroke="#141D2E" stroke-width="3"/>
    <line x1="16" y1="30" x2="88" y2="30" stroke="#141D2E" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="50" x2="88" y2="50" stroke="#141D2E" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="70" x2="70" y2="70" stroke="#141D2E" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="16" y1="96" x2="88" y2="96" stroke="#F3A916" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="112" x2="62" y2="112" stroke="#F3A916" stroke-width="4" stroke-linecap="round"/>
    <circle cx="52" cy="0" r="5" fill="#141D2E"/>
  </g>

  <!-- pinned handcuffs card, upper right -->
  <g class="float-card d2" transform="translate(300,60) rotate(6)">
    <rect x="0" y="0" width="100" height="90" rx="4" fill="#FFFFFF" stroke="#141D2E" stroke-width="3"/>
    <g transform="translate(50,48)">
      <circle cx="-16" cy="0" r="14" fill="none" stroke="#141D2E" stroke-width="4"/>
      <circle cx="16" cy="0" r="14" fill="none" stroke="#141D2E" stroke-width="4"/>
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#141D2E" stroke-width="4"/>
    </g>
    <circle cx="50" cy="0" r="5" fill="#141D2E"/>
  </g>

  <!-- pinned scale card, lower left -->
  <g class="float-card d3" transform="translate(48,240) rotate(-4)">
    <rect x="0" y="0" width="96" height="96" rx="4" fill="#FFFFFF" stroke="#141D2E" stroke-width="3"/>
    <g class="scale-sway" transform="translate(48,50)">
      <line x1="0" y1="-28" x2="0" y2="18" stroke="#141D2E" stroke-width="3"/>
      <line x1="-24" y1="-20" x2="24" y2="-20" stroke="#141D2E" stroke-width="3" stroke-linecap="round"/>
      <path d="M-34,-20 a10,7 0 0 0 20,0 z" fill="#F3A916" stroke="#141D2E" stroke-width="2"/>
      <path d="M14,-20 a10,7 0 0 0 20,0 z" fill="#F3A916" stroke="#141D2E" stroke-width="2"/>
      <rect x="-16" y="18" width="32" height="6" rx="2" fill="#141D2E"/>
    </g>
    <circle cx="48" cy="0" r="5" fill="#141D2E"/>
  </g>

  <!-- pinned note card, right of center -->
  <g class="float-card d4" transform="translate(345,215) rotate(5)">
    <rect x="0" y="0" width="80" height="80" rx="4" fill="#FFFFFF" stroke="#141D2E" stroke-width="3"/>
    <line x1="14" y1="24" x2="66" y2="24" stroke="#141D2E" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <line x1="14" y1="40" x2="66" y2="40" stroke="#141D2E" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <line x1="14" y1="56" x2="46" y2="56" stroke="#F3A916" stroke-width="4" stroke-linecap="round"/>
    <circle cx="40" cy="0" r="5" fill="#141D2E"/>
  </g>

  <!-- gavel, bottom center -->
  <g class="gavel-rock" transform="translate(300,300) rotate(18)">
    <rect x="0" y="0" width="72" height="32" rx="5" fill="#F3A916" stroke="#141D2E" stroke-width="3"/>
    <rect x="-9" y="36" width="11" height="32" rx="3" fill="#F3A916" stroke="#141D2E" stroke-width="3"/>
    <rect x="70" y="36" width="11" height="32" rx="3" fill="#F3A916" stroke="#141D2E" stroke-width="3"/>
    <line x1="72" y1="16" x2="128" y2="58" stroke="#141D2E" stroke-width="7" stroke-linecap="round"/>
  </g>
  <ellipse cx="330" cy="392" rx="70" ry="10" fill="#141D2E" opacity="0.08"/>
</svg>
